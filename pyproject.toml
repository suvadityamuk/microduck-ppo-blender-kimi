[project]
name = "duck-worlds"
version = "0.1.0"
description = "Kimi-K3 writes physically simulated worlds for Pollen's Microduck; PPO fine-tunes its walk inside each one."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Suvaditya Mukherjee" }]
requires-python = ">=3.12"
# The orchestration environment: world generation (Kimi-K3 via HF Inference Providers + Blender), world rebuilds,
# HF Jobs launchers and report tables. Simulation, evaluation and training run in Pollen's microduck_rl environment
# (see README), which provides mjlab, rsl_rl, BAM, MuJoCo and onnxruntime.
dependencies = [
    "huggingface-hub>=1.0",
    "numpy>=2.0,<2.3",
    "scipy>=1.11",
]

[tool.uv.build-backend]
module-name = "robo_worlds"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
